<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Logo regla 50 20 30</title>
  <desc id="desc">Logo circular dividido en tres secciones: necesidades 50%, ahorro 20% y ocio 30%, con símbolo euro en el centro.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#d8d8db"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="120" y1="220" x2="520" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d74ff"/>
      <stop offset="100%" stop-color="#1259de"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="620" y1="160" x2="960" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3cf"/>
      <stop offset="100%" stop-color="#14b8b5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="650" y1="500" x2="940" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade65"/>
      <stop offset="100%" stop-color="#33c85c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <style>
      .icon-stroke { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #fff; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .pct { font-size: 52px; }
    </style>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- 50% segment -->
    <path d="M 152.26 505.50
             A 360 360 0 0 1 498.88 152.00
             L 498.88 332.00
             A 180 180 0 0 0 325.58 508.75
             Z"
          fill="url(#blueGrad)"/>
    <path d="M 502.88 152.02
             A 360 360 0 0 1 506.50 152.00
             L 506.50 332.00
             A 180 180 0 0 0 504.69 332.01
             Z"
          fill="#ffffff"/>
    <path d="M 149.00 512.00
             A 360 360 0 0 0 509.18 872.00
             L 509.18 692.00
             A 180 180 0 0 1 329.09 512.00
             Z"
          fill="url(#blueGrad)"/>

    <!-- 20% segment -->
    <path d="M 518.82 152.00
             A 360 360 0 0 1 871.98 474.94
             L 695.49 505.99
             A 180 180 0 0 0 518.82 332.00
             Z"
          fill="url(#tealGrad)"/>

    <!-- 30% segment -->
    <path d="M 874.00 487.34
             A 360 360 0 0 1 518.82 872.00
             L 518.82 692.00
             A 180 180 0 0 0 696.41 499.67
             Z"
          fill="url(#greenGrad)"/>

    <!-- separators -->
    <path d="M 506.50 152 L 506.50 332" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <path d="M 697.20 505.10 L 874.00 474.00" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <path d="M 518.82 692.00 L 518.82 872.00" stroke="#fff" stroke-width="18" stroke-linecap="round"/>

    <!-- center ring -->
    <circle cx="512" cy="512" r="168" fill="#f7f7f8"/>
    <circle cx="512" cy="512" r="125" fill="none" stroke="#1a67e8" stroke-width="34" stroke-linecap="round"
            stroke-dasharray="560 160" transform="rotate(35 512 512)"/>
    <!-- euro symbol -->
    <g transform="translate(512 512)">
      <path d="M 53 -58
               A 88 88 0 1 0 53 58" fill="none" stroke="#1a67e8" stroke-width="22" stroke-linecap="round"/>
      <path d="M -44 -12 H 35" stroke="#1a67e8" stroke-width="20" stroke-linecap="round"/>
      <path d="M -44 16 H 35" stroke="#1a67e8" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Left: house + 50% -->
  <g transform="translate(210 428)">
    <path class="icon-stroke" d="M 0 30 L 60 -28 L 120 30"/>
    <path class="icon-stroke" d="M 20 26 V 92 H 52 V 54 H 68 V 92 H 100 V 26"/>
    <text x="0" y="190" class="label pct">50%</text>
  </g>

  <!-- Top-right: pig + coin + 20% -->
  <g transform="translate(640 196)">
    <circle cx="70" cy="-8" r="22" fill="none" stroke="#fff" stroke-width="10"/>
    <path class="icon-stroke" d="M 28 88
      C 8 88, 4 76, 4 60
      V 44
      C 4 34, 12 28, 24 24
      L 32 6
      C 34 0, 42 0, 46 4
      L 58 16
      H 102
      C 142 16, 166 40, 166 74
      C 166 96, 154 116, 132 126
      V 146
      H 110
      L 106 126
      H 64
      L 60 146
      H 38
      V 122
      C 22 118, 12 108, 8 94
      H 28 Z"/>
    <circle cx="58" cy="55" r="5" fill="#fff"/>
    <path class="icon-stroke" d="M 166 62 C 166 72, 176 78, 184 72 C 190 68, 192 60, 190 52"/>
    <text x="16" y="236" class="label pct">20%</text>
  </g>

  <!-- Bottom-right: bag + heart + 30% -->
  <g transform="translate(642 655)">
    <path class="icon-stroke" d="M 24 24 H 136 L 126 138 H 34 Z"/>
    <path class="icon-stroke" d="M 54 24 V 0 C 54 -18, 68 -32, 84 -32 C 100 -32, 114 -18, 114 0 V 24"/>
    <path d="M 84 96
             C 73 84, 50 82, 50 102
             C 50 121, 73 128, 84 142
             C 95 128, 118 121, 118 102
             C 118 82, 95 84, 84 96 Z"
          fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <text x="0" y="230" class="label pct">30%</text>
  </g>
</svg>
